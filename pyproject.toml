[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glmharness"
version = "0.2.0"
description = "H1-style plugin agent harness for local GLM-5.3-Flash inference"
readme = "README-HARNESS.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ohmskiii" }]
keywords = ["glm", "agent", "harness", "plugins", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
inference = ["torch>=2.1", "transformers>=5.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "pyright>=1.1.392",
]

[project.scripts]
glm-harness = "glmharness.cli:entry"

[project.urls]
Repository = "https://huggingface.co/ohmskiii/GLM-5.3-Flash"

[tool.hatch.build.targets.wheel]
packages = ["src/glmharness"]

[tool.hatch.build.targets.sdist]
include = ["src/glmharness", "tests", "README-HARNESS.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: opt-in integration tests that exercise the live LLM bridge (run with GLMH_RUN_INTEGRATION=1)",
]

[tool.coverage.run]
source = ["glmharness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["SIM108"]  # ternary is clearer for one-liners

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# ``emit`` dispatch deliberately does not retain the Task handle; the listener
# is fire-and-forget by contract and the bus's lifetime is the event loop.
"src/glmharness/bus.py" = ["RUF006"]
# Blocking input is intentional — we are about to enter the async turn and
# reading stdin from the synchronous main flow is the correct seam.
"src/glmharness/cli.py" = ["ASYNC250"]


[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# ``torch`` and ``transformers`` ship in the optional ``[inference]`` extra;
# CI installs only ``[dev]`` so pyright sees them as missing. Every call site
# already carries ``# type: ignore[import-not-found, ...]`` so disabling the
# import warning for these modules is safe.
reportMissingImports = "none"
